<div class="page">
  <header class="topbar">
    <div class="brand" aria-label="Canal Conciliar">
      <img src="assets/logo-canalconciliar.svg" alt="Canal Conciliar" />
      <div class="brand__text">
        <span class="brand__name">Canal</span>
        <span class="brand__name brand__name--secondary">Conciliar</span>
      </div>
    </div>
    <div class="institution" aria-label="Poder Judiciário da União">
      <span class="institution__eyebrow">Poder Judiciário da União</span>
      <span class="institution__name">TJDFT</span>
    </div>
  </header>

  <main class="hero" aria-labelledby="hero-title">
    <div class="hero__content">
      <h1 id="hero-title">Conciliação online do TJDFT</h1>
      <p>
        Resolva conflitos de forma segura,<br />
        sem sair de casa.
      </p>
      <div class="hero__actions">
        <a class="btn btn--primary" href="#">Cadastrar solicitação</a>
        <a class="btn btn--secondary" href="#">Consultar andamento</a>
      </div>
      <ul class="hero__features">
        <li>
          <span class="hero__icon" aria-hidden="true">✔</span>
          Audiências virtuais com acompanhamento institucional
        </li>
      </ul>
    </div>
    <div class="hero__image" role="presentation">
      <img
        src="assets/hero-illustration.svg"
        alt="Pessoa em atendimento virtual com mediadores em uma tela"
      />
    </div>
  </main>
</div>
